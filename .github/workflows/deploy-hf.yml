name: Deploy to Hugging Face Spaces

# Needs two repo settings (Settings -> Secrets and variables -> Actions):
#   secret   HF_TOKEN       a Hugging Face token with "write" access
#   variable HF_SPACE       optional, defaults to SauravvKumar/ask-saurav
# Optional secrets forwarded to the Space: GROQ_API_KEY, ADMIN_TOKEN

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "notebooks/**", "docs/**"]
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "huggingface_hub>=0.25"
      - name: Upload to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE || secrets.HF_SPACE || 'SauravvKumar/ask-saurav' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          cp deploy/space_README.md README.md   # Spaces read their config from README front matter
          python - <<'PY'
          import os, sys, traceback
          def fail(title, msg):
              print(f"::error title={title}::{msg}".replace("\n", " | ")); sys.exit(1)
          try:
              from huggingface_hub import HfApi
              token, space = os.environ.get("HF_TOKEN", ""), os.environ["HF_SPACE"]
              if not token:
                  fail("HF_TOKEN missing", "Add HF_TOKEN under Settings > Secrets and variables > Actions > Secrets")
              api = HfApi(token=token)
              who = api.whoami()
              print(f"::notice title=Hugging Face login::{who.get('name')} (token role: {who.get('auth', {}).get('accessToken', {}).get('role')})")
              api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
              for name in ("GROQ_API_KEY", "ADMIN_TOKEN"):
                  if os.environ.get(name):
                      api.add_space_secret(space, name, os.environ[name])
                  elif name == "GROQ_API_KEY":
                      print("::warning title=GROQ_API_KEY missing::Chat will fail until GROQ_API_KEY is set")
              api.upload_folder(
                  repo_id=space, repo_type="space", folder_path=".",
                  ignore_patterns=[".git/*", ".github/*", "notebooks/*", "tests/*", "eval/*", "docs/*", "deploy/*", "storage/*"],
                  commit_message=f"Deploy {os.environ.get('GITHUB_SHA', '')[:7]}",
              )
              print(f"::notice title=Deployed::https://huggingface.co/spaces/{space}")
          except SystemExit:
              raise
          except Exception as e:
              traceback.print_exc()
              fail(type(e).__name__, str(e)[:900])
          PY
