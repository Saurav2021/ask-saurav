name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest httpx ruff
      - name: Lint
        run: ruff check app tests eval
      - name: Unit + API tests (offline, fake LLM)
        run: pytest -q

  retrieval-eval:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('app/config.py') }}
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Retrieval eval (real MiniLM embeddings, fails below Hit@4 = 0.85)
        run: python -m eval.retrieval_eval --min-hit 0.85
      - name: Answer eval (runs only if GROQ_API_KEY secret is set)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m eval.answer_eval
      - name: Publish results to job summary
        if: always()
        run: cat eval/results_*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results_*.md
