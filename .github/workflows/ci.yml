name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest httpx ruff
      - name: Lint
        run: ruff check app tests eval
      - name: Unit + API tests (offline, fake LLM)
        run: pytest -q

  retrieval-eval:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: storage/models
          key: fastembed-${{ hashFiles('app/config.py') }}
      - name: Install
        run: pip install -r requirements.txt
      - name: Retrieval eval (real MiniLM embeddings, fails below Hit@4 = 0.85)
        run: python -m eval.retrieval_eval --min-hit 0.85
      - name: Answer eval (runs only if GROQ_API_KEY secret is set)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m eval.answer_eval
      - name: Publish results to job summary
        if: always()
        run: cat eval/results_*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results_*.md

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (same Dockerfile Render uses)
        run: docker build -t ask-saurav .
      - name: Run and smoke-test under Render's 512 MB limit
        run: |
          docker run -d --name app -p 8000:8000 --memory=512m -e GROQ_API_KEY=dummy ask-saurav
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 2; done
          curl -fsS localhost:8000/health
          # exercises embedding + Chroma retrieval; the LLM call fails on the dummy key and must degrade to 503
          code=$(curl -s -o /tmp/chat.json -w "%{http_code}" -X POST localhost:8000/chat -H 'content-type: application/json' -d '{"question":"What is AURA?"}')
          echo "chat status: $code"; cat /tmp/chat.json; echo
          test "$code" = "503" && grep -q "sauravsuz@gmail.com" /tmp/chat.json
          mem=$(docker stats --no-stream --format '{{.MemUsage}}' app)
          echo "::notice title=Container memory after a query::$mem"
      - name: Container logs
        if: always()
        run: |
          docker logs app 2>&1 | tail -40
          docker logs app 2>&1 | grep -iE "error|exception" | head -5 | while read -r l; do echo "::warning title=container log::$l"; done
