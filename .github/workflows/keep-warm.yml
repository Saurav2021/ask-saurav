name: Keep chatbot warm

# Render's free tier sleeps after 15 idle minutes and takes ~1 minute to wake.
# One always-on free service uses ~730 of the 750 free instance-hours a month.
# Set the repo variable BACKEND_URL (e.g. https://ask-saurav.onrender.com) to enable.

on:
  schedule:
    - cron: "*/10 2-18 * * *"   # every 10 min, 07:30–00:30 IST (recruiter hours)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.BACKEND_URL != '' }}
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.BACKEND_URL }}/health"
